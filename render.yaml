# =====================================================================
# Render Blueprint — Smart 1 Sales Builder (Proposals & Insertion Orders)
# ---------------------------------------------------------------------
# Deploy this folder as its own Render web service (separate from the
# existing insertionordersmart service, which stays untouched).
#
# The free/starter Postgres below is what makes quotes survive deploys.
# If you skip the database, the Sales Builder still runs on SQLite but the data
# resets whenever Render replaces the instance — add the database.
# =====================================================================
databases:
  - name: smart1-sales-builder-db
    plan: basic-256mb

services:
  - type: web
    name: smart1-sales-builder
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 180 --workers 2 --threads 4
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: smart1-sales-builder-db
          property: connectionString
      # The existing IO app — API for AI routes + IO conversion, and the
      # embedded IO builder tab. Change if the IO app URL ever moves.
      - key: IO_API_BASE
        value: https://insertionordersmart.onrender.com
      - key: IO_APP_URL
        value: https://insertionordersmart.onrender.com
      # Optional: enables "draft a proposal from one sentence" and the
      # AI section rewriter in the Sales Builder itself (the IO app's AI routes
      # keep working either way).
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      # Vision model used by the Tools > SEO Image Optimizer to write
      # filenames and alt text. Needs OPENAI_API_KEY above to be set.
      - key: OPENAI_VISION_MODEL
        value: gpt-4o
      # Optional: hosts optimized images. Without it the image tool still
      # resizes and converts, and returns a ZIP + alt-text.csv instead.
      # Paste the same CLOUDINARY_URL the insertionordersmart service uses.
      - key: CLOUDINARY_URL
        sync: false
      - key: MAX_UPLOAD_MB
        value: "60"
